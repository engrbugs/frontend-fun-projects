name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            */package-lock.json

      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html gallery.css site/
          cp -R screenshots SurveyForm TechnicalDocumentation site/

      - name: Build React projects
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          for app in random-quote-machine drum-machine pomodoro-clock react-app-calculator markdown-previewer; do
            npm ci --legacy-peer-deps --prefix "$app"
            npm run build --prefix "$app"
            mkdir -p "site/$app"
            cp -R "$app/build/." "site/$app/"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
